<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f6"><title>Préparer le sondage — Pulse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i></span>pulse<span class="brand-dot">.</span></a><span class="top-note">Préparation du sondage</span><a class="text-button" href="index.html">← Retour</a></header>
<main class="page-wrap question-page"><div class="eyebrow">VOTRE SONDAGE</div><h1 class="page-title" id="pageTitle">Préparez vos questions</h1><p class="intro">Ajoutez les questions et leurs réponses possibles. Les réglages de session se trouvent ici aussi.</p>
<section class="authoring-card"><div id="questionList"></div><button class="add-question" id="addQuestion">＋ Ajouter une question</button></section>
<section class="settings-card"><div class="settings-heading"><h2>Réglages du sondage</h2><p>Choisissez comment se déroule la session.</p></div><label class="switch-row"><span><strong>Demander le nom des participants</strong><small>Sinon, les réponses sont anonymes.</small></span><input type="checkbox" id="askName"><i></i></label><div class="setting-line"><label for="advanceMode">Passer à la question suivante</label><select id="advanceMode"><option value="manual">Quand je le décide</option><option value="timed">Après un délai</option></select></div><div class="setting-line" id="delayField" hidden><label for="delaySeconds">Délai avant la question suivante</label><div class="seconds-input"><input type="number" id="delaySeconds" value="30" min="5" max="600"><span>secondes</span></div></div></section>
<div class="bottom-actions"><a class="cancel-button" href="index.html">Annuler</a><button class="primary-button" id="launchBtn">Lancer le sondage <span>→</span></button></div>

</main><div class="toast" id="toast" role="status"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="questions.js"></script></body></html>
